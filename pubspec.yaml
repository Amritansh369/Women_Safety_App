name: women_safety_app
description: SafeHer - a personal safety app with verified SOS alerts, live location, Safe Walk check-ins, and trusted emergency contacts.
publish_to: 'none'
version: 2.1.0+3

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  geolocator: ^14.0.0         # GPS + the Android foreground service during an emergency
  url_launcher: ^6.2.5        # open SMS composer / make calls
  shared_preferences: ^2.2.2  # store contacts, settings & incident log locally
  permission_handler: ^12.0.0 # request location/SMS/notification permissions
  intl: ^0.20.2               # date/time formatting
  sensors_plus: ^7.1.1        # accelerometer for shake-to-SOS
  flutter_map: ^8.3.2         # in-app map (OpenStreetMap, no API key needed)
  latlong2: ^0.10.1           # coordinates for flutter_map
  audioplayers: ^6.8.1        # siren & fake-call ringtone
  crypto: ^3.0.8              # password hashing for the local account
  share_plus: ^13.3.1         # share location through any app
  clock: ^1.1.1               # testable wall-clock time for timers
  http: ^1.6.0
  flutter_native_contact_picker: ^0.0.13
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
